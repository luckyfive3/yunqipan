# docker-compose.dev.yml —— 云栖盘本地开发依赖：PostgreSQL 16 + Redis 7 + S3 兼容对象存储（adobe/s3mock）。
#
# 说明：MinIO 社区版镜像/二进制自 2025 年起已停止公开分发（dl.min.io 410、Docker Hub 匿名拉取被拒），
# 因此开发环境改用同为标准 S3 API 的轻量服务 adobe/s3mock（支持 Multipart 分块上传/ListParts/Range 下载）。
# 注意固定 3.11.0：4.x 重写版的 multipart 状态管理不稳定（分块丢失/ListParts 异常）。
# 服务端代码对接的是标准 S3 API（aws-sdk-go-v2），生产环境可无缝切换为
# MinIO 企业版 / AWS S3 / 阿里云 OSS 等任意 S3 兼容存储，只需修改 MINIO_* 环境变量。
# 服务端本体用 `go run ./cmd/server` 在宿主机运行；bucket 由服务端启动时自动创建（EnsureBucket）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: wangpan-postgres
    environment:
      POSTGRES_USER: wangpan
      POSTGRES_PASSWORD: wangpan
      POSTGRES_DB: wangpan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wangpan -d wangpan"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: wangpan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  s3mock:
    image: adobe/s3mock:3.11.0
    container_name: wangpan-s3mock
    environment:
      initialBuckets: wangpan     # 预建 bucket（服务端 EnsureBucket 亦会幂等自建）
    ports:
      - "19000:9090"   # S3 API：宿主 19000（避开常见 9000 端口冲突）→ 容器 9090 HTTP
    healthcheck:
      # 镜像为 Alpine：无 curl/bash，用 nc TCP 探测 HTTP 端口
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "9090"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
